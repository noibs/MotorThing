[project]
name = "motor"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "micropython-rp2-stubs>=1.29.0.post1",
]

[dependency-groups]
dev = [
    "mpremote>=1.29.0",
]

[tool.basedpyright]
typeCheckingMode = "basic"
stubPath = "typings"
reportMissingModuleSource = false
venvPath = "."
venv = ".venv"
